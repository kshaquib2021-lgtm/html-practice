<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex justify-center items-center h-screen bg-gray-100">

    <div class="w-1/5 shadow-lg bg-white p-8 rounded-lg">
        <h2 class="text-3xl font-semibold text-center my-6">Login Form</h2>
        <form>
            <label for="">Email Address</label>
            <input type="email" class="block w-full border p-2 rounded-md mb-6 mt-1">

            <label for="">Password</label>
            <input type="password" class="block w-full border p-2 rounded-md mb-6 mt-1">

            <a href="#" class="text-[blueviolet] block text-right mb-4">
                Forgot Password
            </a>

            <button class="block bg-[blueviolet] text-white p-2 w-full rounded-md">
                Submit
            </button>

            <a href="#" class="text-[blueviolet] block text-center mt-4">
                Signup Now
            </a>

        </form>

    </div>


</body>

</html>
